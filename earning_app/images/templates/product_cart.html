{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>My Earning Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; }
        .card img { height: 200px; object-fit: cover; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">My Portfolio</a>
    <a class="btn btn-warning" href="/earning/">Earning: $0</a>
  </div>
</nav>

<div class="container mt-4">
    <h2 class="text-center mb-4">🛒 Earning Products - Add to Cart</h2>
    
    <div class="row">
        <!-- Product 1 -->
        <div class="col-md-4">
            <div class="card shadow">
                <img src="https://via.placeholder.com/300x200?text=Product+1" class="card-img-top">
                <!-- Agar aapki image dikhani hai to neeche wali line use karo
                <img src="{% static '1.jpeg' %}" class="card-img-top">
                -->
                <div class="card-body text-center">
                    <h5>Product 1</h5>
                    <p>Price: $500</p>
                    <button class="btn btn-success w-100" onclick="addToCart(500)">Add to Cart</button>
                </div>
            </div>
        </div>

        <!-- Product 2 -->
        <div class="col-md-4">
            <div class="card shadow">
                <img src="https://via.placeholder.com/300x200?text=Product+2" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Product 2</h5>
                    <p>Price: $700</p>
                    <button class="btn btn-success w-100" onclick="addToCart(700)">Add to Cart</button>
                </div>
            </div>
        </div>

        <!-- Product 3 -->
        <div class="col-md-4">
            <div class="card shadow">
                <img src="https://via.placeholder.com/300x200?text=Product+3" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Product 3</h5>
                    <p>Price: $900</p>
                    <button class="btn btn-success w-100" onclick="addToCart(900)">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card mt-5 p-4 text-center shadow">
        <h3>Total Earning: $<span id="total">0</span></h3>
        <h5>Items in Cart: <span id="count">0</span></h5>
        <button class="btn btn-primary mt-3" onclick="checkout()">Checkout</button>
    </div>
</div>
<script>
let total = 0;
let count = 0;
function addToCart(price){
    total += price;
    count++;
    document.getElementById('total').textContent = total;
    document.getElementById('count').textContent = count;
}

function checkout(){
    alert(`Checkout total: $${total}`);
}
    </script>
    </body>
    </html>

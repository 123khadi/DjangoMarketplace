<!DOCTYPE html>
<html>
<head><title>Get Started</title><style>body{font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;background:#f4f4f4} .box{background:white;padding:30px;border-radius:10px;box-shadow:0 0 10px #ccc;width:300px} input{width:100%;padding:10px;margin:10px 0} button{width:100%;padding:10px;background:green;color:white;border:none;cursor:pointer}</style></head>
<body>
<div class="box">
<h2>Create Account</h2>
<form method="POST">{% csrf_token %}
<input type="text" name="username" placeholder="Username" required>
<input type="email" name="email" placeholder="Email" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Get Started</button>
</form>
<p>Already account? <a href="/login/">Login</a></p>
</div>
</body>
</html>

{% extends 'base.html' %}
{% block content %}
<div class="container" style="padding:40px; color:white;">
  <h2 style="font-size:32px; margin-bottom:25px;">Your Products</h2>
  
  {% if products %}
  <div class="grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:20px;">
    {% for product in products %}
    <div class="card" style="background:white; color:black; border-radius:15px; overflow:hidden;">
      <div style="padding:20px;">
        <h3>{{ product.name }}</h3>
        <p>${{ product.price }}</p>
        <p>{{ product.description }}</p>
        <a href="{% url 'buy_now' product.id %}" style="background:#38bdf8; display:block; text-align:center; padding:10px; border-radius:8px; margin-top:10px; color:white; text-decoration:none;">Buy Now</a>
      </div>
    </div>
    {% endfor %}
  </div>
  {% else %}
  <p>No products found. Please add from <a href="/admin/">Admin Panel</a></p>
  {% endif %}
</div>
{% endblock %}

<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>
body{font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;background:#f4f4f4;margin:0}
.box{background:white;padding:30px;border-radius:10px;box-shadow:0 0 15px #ccc;width:320px}
input{width:100%;padding:12px;margin:10px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:5px}
button{width:100%;padding:12px;background:black;color:white;border:none;cursor:pointer;border-radius:5px;font-size:16px}
a{color:blue;text-decoration:none}
</style>
</head>
<body>
<div class="box">
<h2>Login</h2>
<form method="POST">
{% csrf_token %}
<input type="text" name="username" placeholder="Username" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<p style="margin-top:15px">Account nahi hai? <a href="/get-started/">Get Started</a></p>
</div>
</body>
</html>
